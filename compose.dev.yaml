# Containerized Bun development environment.
name: pdmux-dev

services:
  traefik:
    profiles: [podokit-legacy-proxy]
    image: traefik:v3.5
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "${TRAEFIK_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [podokit]

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PODOKIT_NPM_REGISTRY: ${PODOKIT_NPM_REGISTRY:-}
    command: bun run --cwd apps/web dev -- --host 0.0.0.0
    working_dir: /app
    env_file: .env.docker
    environment:
      - VITE_DOCKER=1
      - BACKEND_INTERNAL_URL=http://api:5002
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1
    depends_on: [api]
    networks: [podokit]
    develop:
      watch:
        - { action: sync, path: ./apps/web/src, target: /app/apps/web/src }
        - { action: sync, path: ./apps/web/static, target: /app/apps/web/static }
        - { action: sync+restart, path: ./apps/web/vite.config.ts, target: /app/apps/web/vite.config.ts }
        - { action: rebuild, path: ./apps/web/package.json }

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PODOKIT_NPM_REGISTRY: ${PODOKIT_NPM_REGISTRY:-}
    init: true
    command: bun run --cwd apps/api dev
    working_dir: /app
    env_file: .env.docker
    depends_on:
      postgres: { condition: service_healthy }
    networks: [podokit]
    develop:
      watch:
        - { action: sync+restart, path: ./apps/api/src, target: /app/apps/api/src }
        - { action: sync, path: ./apps/api/scripts, target: /app/apps/api/scripts }
        - { action: rebuild, path: ./apps/api/package.json }

  worker:
    profiles: [queue]
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PODOKIT_NPM_REGISTRY: ${PODOKIT_NPM_REGISTRY:-}
    init: true
    command: bun run --cwd apps/api dev:worker
    working_dir: /app
    env_file: .env.docker
    depends_on:
      redis: { condition: service_started }
    networks: [podokit]
    develop:
      watch:
        - { action: sync+restart, path: ./apps/api/src, target: /app/apps/api/src }
        - { action: sync, path: ./apps/api/scripts, target: /app/apps/api/scripts }
        - { action: rebuild, path: ./apps/api/package.json }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: podokit
      POSTGRES_PASSWORD: podokit
      POSTGRES_DB: podokit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podokit"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [podokit]

  redis:
    profiles: [cache]
    image: redis:7-alpine
    networks: [podokit]

  minio:
    profiles: [storage]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: podokit
      MINIO_ROOT_PASSWORD: podokitsecret
    volumes:
      - miniodata:/data
    networks: [podokit]

  minio-init:
    profiles: [storage]
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_started }
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set loc http://minio:9000 podokit podokitsecret; do sleep 1; done
        mc mb -p loc/podokit || true
    networks: [podokit]

networks:
  podokit: {}

volumes:
  pgdata: {}
  miniodata: {}
