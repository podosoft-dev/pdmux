name: desktop

on:
  workflow_call:
    inputs:
      signed:
        description: Use Developer ID signing and notarization (release tags only)
        required: false
        default: false
        type: boolean
      source_ref:
        description: Git ref whose application source is packaged
        required: false
        default: ""
        type: string
      agent_artifact:
        description: Existing canonical agent artifact from this workflow run
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".gitattributes"
      - "agent/**"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/desktop/**"
      - "packages/**"
      - "tools/prepare-desktop-runtime.mjs"
      - "tools/merge-desktop-update-metadata.mjs"
      - "tools/*macos*"
      - "tools/apple-signing*"
      - "tools/agent-artifacts*"
      - ".github/workflows/agent-binaries.yml"
      - "tools/*desktop*"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      signed:
        description: Use Developer ID signing and notarization (release tags only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# A newer push to a pull request supersedes the packages of the older one. A release
# calls this workflow from a tag, so every other event gets a group of its own and is
# never cancelled.
concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent:
    if: ${{ !inputs.agent_artifact }}
    uses: ./.github/workflows/agent-binaries.yml
    with:
      signed: ${{ inputs.signed || false }}
      source_ref: ${{ inputs.source_ref || (inputs.signed && github.ref_name) || github.ref }}
    secrets: inherit

  windows-terminal:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Test native Windows pseudoconsole
        working-directory: agent
        run: go test ./internal/term -run TestWindowsConPTY -count=1 -timeout=90s

  package:
    name: ${{ matrix.name }}
    needs: agent
    if: ${{ !cancelled() && (needs.agent.result == 'success' || (needs.agent.result == 'skipped' && inputs.agent_artifact != '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            command: --mac --x64
            artifact: macos-intel
          - name: macOS Apple Silicon
            runner: macos-26
            command: --mac --arm64
            artifact: macos-apple-silicon
          - name: Windows x64
            runner: windows-2025
            command: --win --x64
            artifact: windows-x64
          - name: Linux x64
            runner: ubuntu-24.04
            command: --linux --x64
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.signed && startsWith(matrix.artifact, 'macos-') && 'desktop-signing' || 'desktop-build' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun ci

      - name: Build shared packages
        run: |
          bun run --filter @pdmux/desktop-protocol build
          bun run --filter @pdmux/protocol build
          bun run --filter @pdmux/core build
          bun run --filter @pdmux/ui build
          bun run --filter @pdmux/mcp build

      # A relative path keeps GNU tar on Windows from reading a drive letter as a host.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.agent_artifact || 'agent-binaries' }}
          path: .agent-binaries

      - name: Restore the shared host-agent binaries
        shell: bash
        run: |
          cp -R apps/web/static/agent "$RUNNER_TEMP/agent-source"
          tar -xf .agent-binaries/agent-binaries.tar -C apps/web/static
          rm -rf .agent-binaries

      - name: Build embedded services
        run: |
          bun run --filter pdmux-api build
          bun run --filter pdmux-web build
          bun run --filter pdmux-desktop build
          bun run desktop:prepare

      - name: Test desktop runtime
        run: |
          bun run --filter pdmux-desktop lint
          bun run --filter pdmux-desktop test
          bun test tools/desktop-build-profile.test.mjs tools/seed-desktop-agents.test.mjs

      - name: Package unsigned desktop application
        if: runner.os != 'macOS'
        run: bun run --cwd apps/desktop package -- ${{ matrix.command }} --publish never

      - name: Package macOS validation application with a disposable identity
        if: ${{ runner.os == 'macOS' && !inputs.signed }}
        run: bun tools/package-macos-desktop.mjs --ci-probe

      - name: Package macOS release with Developer ID and notarization
        if: ${{ runner.os == 'macOS' && inputs.signed }}
        run: bun tools/release-macos-signing.mjs
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_G2_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_G2_CERT_BASE64 }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          PDMUX_AGENT_SOURCE_ROOT: ${{ runner.temp }}/agent-source
          PDMUX_SIGNING_SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}

      - name: Preserve architecture-specific macOS update metadata
        if: runner.os == 'macOS'
        shell: bash
        run: mv apps/desktop/release/latest-mac.yml apps/desktop/release/latest-mac-${{ matrix.artifact }}.yml

      - uses: actions/upload-artifact@v4
        with:
          name: pdmux-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          # Installers, archives, and blockmaps are already compressed.
          compression-level: 0

  prepare-update-probe:
    if: ${{ inputs.signed }}
    runs-on: macos-26
    environment: desktop-signing
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test native Windows pseudoconsole
        if: runner.os == 'Windows'
        working-directory: agent
        run: go test ./internal/term -run TestWindowsConPTY -count=1 -timeout=90s

      - run: bun ci
      - name: Prepare Developer ID update fixtures
        run: bun tools/probe-macos-developer-id-update.mjs --prepare
        env:
          PDMUX_PROBE_ARCHIVES: ${{ runner.temp }}/developer-id-update
          PDMUX_SIGNING_SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_G2_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_G2_CERT_BASE64 }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: developer-id-update-probe
          path: |
            ${{ runner.temp }}/developer-id-update/out-*/*.zip
            ${{ runner.temp }}/developer-id-update/out-*/*.yml
            ${{ runner.temp }}/developer-id-update/out-*/*.blockmap
          retention-days: 1
          if-no-files-found: error

  verify-update-probe:
    needs: prepare-update-probe
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test native Windows pseudoconsole
        if: runner.os == 'Windows'
        working-directory: agent
        run: go test ./internal/term -run TestWindowsConPTY -count=1 -timeout=90s

      - run: bun ci
      - uses: actions/download-artifact@v4
        with:
          name: developer-id-update-probe
          path: ${{ runner.temp }}/developer-id-update
      - name: Verify Developer ID update and relaunch without imported keys
        run: bun tools/probe-macos-developer-id-update.mjs --verify
        env:
          PDMUX_PROBE_ARCHIVES: ${{ runner.temp }}/developer-id-update

  verify-macos:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact: macos-intel
          - runner: macos-26
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test native Windows pseudoconsole
        if: runner.os == 'Windows'
        working-directory: agent
        run: go test ./internal/term -run TestWindowsConPTY -count=1 -timeout=90s

      - run: bun ci
      - uses: actions/download-artifact@v4
        with:
          name: pdmux-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.agent_artifact || 'agent-binaries' }}
          path: ${{ runner.temp }}/agent-reference
      - name: Restore canonical agent verification reference
        shell: bash
        run: tar -xf "$RUNNER_TEMP/agent-reference/agent-binaries.tar" -C "$RUNNER_TEMP/agent-reference"
      - name: Verify final macOS packages on a clean runner
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/desktop-verify
          PDMUX_AGENT_ARTIFACT_ROOT: ${{ runner.temp }}/agent-reference/agent
          PDMUX_VERIFY_RELEASE_IDENTITY: ${{ inputs.signed && '1' || '0' }}
        run: bun tools/verify-macos-desktop.mjs "$PACKAGE_DIRECTORY" --runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify/*.png
          if-no-files-found: ignore
          retention-days: 3

  verify-platforms:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            artifact: windows-x64
          - runner: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test native Windows pseudoconsole
        if: runner.os == 'Windows'
        working-directory: agent
        run: go test ./internal/term -run TestWindowsConPTY -count=1 -timeout=90s

      - run: bun ci
      - uses: actions/download-artifact@v4
        with:
          name: pdmux-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openssl
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.agent_artifact || 'agent-binaries' }}
          path: .agent-reference
      - name: Restore canonical agent verification reference
        shell: bash
        run: tar -xf .agent-reference/agent-binaries.tar -C .agent-reference
      - name: Verify Windows installation and runtime
        env:
          PDMUX_AGENT_ARTIFACT_ROOT: ${{ github.workspace }}/.agent-reference/agent
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun tools/verify-desktop-artifacts.mjs "$env:RUNNER_TEMP/desktop-verify"
      - name: Verify Debian and AppImage runtimes
        env:
          PDMUX_AGENT_ARTIFACT_ROOT: ${{ github.workspace }}/.agent-reference/agent
        if: runner.os == 'Linux'
        run: xvfb-run -a bun tools/verify-desktop-artifacts.mjs "$RUNNER_TEMP/desktop-verify"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify/*.png
          if-no-files-found: ignore
          retention-days: 3
