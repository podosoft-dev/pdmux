name: desktop

on:
  workflow_call:
    inputs:
      signed:
        description: Use the stable self-signed macOS release identity (release tags only)
        required: false
        default: false
        type: boolean
      source_ref:
        description: Git ref whose application source is packaged
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".gitattributes"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/desktop/**"
      - "packages/**"
      - "tools/prepare-desktop-runtime.mjs"
      - "tools/merge-desktop-update-metadata.mjs"
      - "tools/*macos*"
      - "tools/*desktop*"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      signed:
        description: Use the stable self-signed macOS release identity (release tags only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The host-agent binaries are cross-compiled, so their bytes do not depend on the
  # runner that builds them. Building them once here, with the Go module and build
  # cache that `ci` warms, replaces a cold Go install and four cross-compiles on every
  # installer runner (about two minutes on the Intel macOS runner, the slowest one).
  # The verify jobs below still check the packaged copies against the committed
  # SHA256SUMS, and the release compares these bytes with both web images.
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Same action version and inputs as the `ci` agent job, so this restores the
      # cache that `ci` saves on main instead of starting a separate one.
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - run: bun run build:agent

      # Artifacts drop file modes; the archive keeps the binaries executable.
      - name: Archive the host-agent release
        run: tar -cf agent-binaries.tar -C apps/web/static agent

      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: agent-binaries.tar
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            command: --mac --x64
            artifact: macos-intel
          - name: macOS Apple Silicon
            runner: macos-26
            command: --mac --arm64
            artifact: macos-apple-silicon
          - name: Windows x64
            runner: windows-2025
            command: --win --x64
            artifact: windows-x64
          - name: Linux x64
            runner: ubuntu-24.04
            command: --linux --x64
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.signed && startsWith(matrix.artifact, 'macos-') && 'desktop-signing' || 'desktop-build' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun ci

      - name: Build shared packages
        run: |
          bun run --filter @pdmux/protocol build
          bun run --filter @pdmux/core build
          bun run --filter @pdmux/ui build
          bun run --filter @pdmux/mcp build

      # A relative path keeps GNU tar on Windows from reading a drive letter as a host.
      - uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: .agent-binaries

      - name: Restore the shared host-agent binaries
        shell: bash
        run: |
          tar -xf .agent-binaries/agent-binaries.tar -C apps/web/static
          rm -rf .agent-binaries

      - name: Build embedded services
        run: |
          bun run --filter pdmux-api build
          bun run --filter pdmux-web build
          bun run --filter pdmux-desktop build
          bun run desktop:prepare

      - name: Test desktop runtime
        run: |
          bun run --filter pdmux-desktop lint
          bun run --filter pdmux-desktop test

      - name: Package unsigned desktop application
        if: runner.os != 'macOS'
        run: bun run --cwd apps/desktop package -- ${{ matrix.command }} --publish never

      - name: Package macOS validation application with a disposable identity
        if: ${{ runner.os == 'macOS' && !inputs.signed }}
        run: bun tools/package-macos-desktop.mjs --ci-probe

      - name: Package macOS release with the stable signing identity
        if: ${{ runner.os == 'macOS' && inputs.signed }}
        run: bun tools/release-macos-signing.mjs
        env:
          DESKTOP_MAC_P12: ${{ secrets.DESKTOP_MAC_P12 }}
          DESKTOP_MAC_PASSWORD: ${{ secrets.DESKTOP_MAC_PASSWORD }}
          PDMUX_SIGNING_SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}

      - name: Preserve architecture-specific macOS update metadata
        if: runner.os == 'macOS'
        shell: bash
        run: mv apps/desktop/release/latest-mac.yml apps/desktop/release/latest-mac-${{ matrix.artifact }}.yml

      - uses: actions/upload-artifact@v4
        with:
          name: pdmux-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  verify-macos:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact: macos-intel
          - runner: macos-26
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - uses: actions/download-artifact@v4
        with:
          name: pdmux-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify
      - name: Verify final macOS packages on a clean runner
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/desktop-verify
          PDMUX_VERIFY_RELEASE_IDENTITY: ${{ inputs.signed && '1' || '0' }}
        run: bun tools/verify-macos-desktop.mjs "$PACKAGE_DIRECTORY" --runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify/*.png
          if-no-files-found: ignore
          retention-days: 3

  verify-platforms:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            artifact: windows-x64
          - runner: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - uses: actions/download-artifact@v4
        with:
          name: pdmux-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openssl
      - name: Verify Windows installation and runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun tools/verify-desktop-artifacts.mjs "$env:RUNNER_TEMP/desktop-verify"
      - name: Verify Debian and AppImage runtimes
        if: runner.os == 'Linux'
        run: xvfb-run -a bun tools/verify-desktop-artifacts.mjs "$RUNNER_TEMP/desktop-verify"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-verify/*.png
          if-no-files-found: ignore
          retention-days: 3
