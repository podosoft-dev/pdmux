name: macOS self-signed update probe

on:
  pull_request:
    paths:
      - "tools/probe-macos-adhoc-update*"
      - ".github/workflows/macos-update-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun test tools/probe-macos-adhoc-update.test.mjs
      - name: Verify native Tahoe architecture
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
      - name: Build disposable signed archives
        env:
          PDMUX_PROBE_ARCHIVES: ${{ runner.temp }}/probe-archives
        run: bun tools/probe-macos-adhoc-update.mjs --prepare-self-signed
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-update-archives
          path: ${{ runner.temp }}/probe-archives
          retention-days: 1
          if-no-files-found: error

  probe:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - uses: actions/download-artifact@v4
        with:
          name: disposable-update-archives
          path: ${{ runner.temp }}/probe-archives
      - name: Verify clean native Tahoe runner
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          if security find-certificate -c 'Pdmux Probe A'; then exit 1; fi
          if security find-certificate -c 'Pdmux Probe C'; then exit 1; fi
      - name: Verify signatures and real version-to-version update
        env:
          PDMUX_PROBE_ARCHIVES: ${{ runner.temp }}/probe-archives
        run: bun tools/probe-macos-adhoc-update.mjs --verify-self-signed
