name: runtime-readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: bun ci
      # Playwright installs Chromium's system packages with apt on every run, from a runner
      # mirror that is often slow or stalls. Keep the downloaded packages in the Actions cache,
      # and bound the step so a stalled mirror fails in minutes instead of eating the job.
      - name: Keep apt packages for the Playwright system dependencies
        run: |
          mkdir -p "$HOME/.cache/apt-archives/partial"
          printf 'Dir::Cache::Archives "%s/.cache/apt-archives";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAcquire::Retries "3";\nAcquire::http::Timeout "30";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/90pdmux-playwright-archives
      - name: Cache apt packages for Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-apt-${{ runner.os }}-
      - name: Install Chromium and its system packages
        timeout-minutes: 6
        run: bunx playwright install --with-deps chromium
      - run: bun run build:agent
      - run: bun run build
      - name: Verify SQLite runtime and real agent
        run: bun run test:readiness
      - name: Verify PostgreSQL runtime and real agent
        env:
          READINESS_DATABASE: postgres
        run: bun run test:readiness
      - name: Let the cache step read the apt packages
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-archives" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-browser-evidence
          path: tests/test-results/
          if-no-files-found: ignore
          retention-days: 3
