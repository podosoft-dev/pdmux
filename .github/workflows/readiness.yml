name: runtime-readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: bun ci
      - run: bunx playwright install --with-deps chromium
      - run: bun run build:agent
      - run: bun run build
      - name: Verify SQLite runtime and real agent
        run: bun run test:readiness
      - name: Verify PostgreSQL runtime and real agent
        env:
          READINESS_DATABASE: postgres
        run: bun run test:readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-browser-evidence
          path: tests/test-results/
          if-no-files-found: ignore
          retention-days: 3
