# Build and publish release images, agent artifacts, and desktop applications for a tag.
#
# `podo deploy` consumes images; it does not build them. Tagging a commit produces
# the two images that `podo deploy apply` rolls out. The workflow stops at publish,
# because rollout requires a person to approve the exact deployment plan hash.
#
# amd64 and arm64 are built on native GitHub-hosted runners. Each matrix job pushes
# untagged image digests, and the publish job joins both digests into one manifest
# tag. Publishing a tag from each architecture would let the last writer silently
# replace the other architecture.
#
# The release also attaches the four host-agent binaries, native desktop installers,
# checksums, update metadata, and the agent manifest. Agents still download from the
# authenticated PDMUX server; the GitHub assets are the public distribution surface.

name: release

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Existing release tag to rebuild idempotently
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ inputs.releaseTag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.profile.outputs.api }}
      web: ${{ steps.profile.outputs.web }}
      registry: ${{ steps.profile.outputs.registry }}
      tag: ${{ steps.profile.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.releaseTag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun ci

      # Workspace packages expose their compiled entry points to the apps, so they
      # must exist before lint resolves the workspace imports.
      - name: Build packages
        run: |
          bun run --filter @pdmux/protocol build
          bun run --filter @pdmux/core build
          bun run --filter @pdmux/ui build
          bun run --filter @pdmux/mcp build

      - run: bun run lint
      - run: bun run test
      - run: bun run test:release-workflow

      - name: Read the release target from the deployment profile
        id: profile
        run: |
          bun -e '
            import { readFileSync } from "node:fs";
            const name = process.env.PROFILE || "production";
            const path = `.podokit/deploy/${name}.json`;
            let profile;
            try {
              profile = JSON.parse(readFileSync(path, "utf8"));
            } catch {
              throw new Error(`No deployment profile at ${path}. Run podo deploy init first.`);
            }
            const { apiRepository, webRepository } = profile.release ?? {};
            if (!apiRepository || !webRepository) {
              throw new Error(`${path} does not declare release.apiRepository and release.webRepository.`);
            }
            const first = apiRepository.split("/")[0];
            const registry = /[.:]/.test(first) ? first : "";
            const releaseTag = process.env.RELEASE_TAG ?? "";
            if (!/^v\d+\.\d+\.\d+$/.test(releaseTag)) {
              throw new Error(`Release tag must be a plain vX.Y.Z tag, received ${releaseTag || "nothing"}.`);
            }
            const out = [
              `api=${apiRepository}`,
              `web=${webRepository}`,
              `registry=${registry}`,
              `tag=${releaseTag}`,
            ].join("\n");
            process.stdout.write(out + "\n");
          ' >> "$GITHUB_OUTPUT"
        env:
          PROFILE: ${{ vars.PODOKIT_DEPLOY_PROFILE }}
          RELEASE_TAG: ${{ inputs.releaseTag || github.ref_name }}

  build:
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.releaseTag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.verify.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest so the architecture jobs cannot overwrite one shared tag.
      - name: Build and push the API image by digest
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ needs.verify.outputs.api }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,scope=api-${{ matrix.arch }},mode=max

      - name: Build and push the web image by digest
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ needs.verify.outputs.web }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max

      - name: Hand the digests to the publish job
        run: |
          mkdir -p /tmp/digests/api /tmp/digests/web
          api='${{ steps.api.outputs.digest }}'
          web='${{ steps.web.outputs.digest }}'
          [ -n "$api" ] && [ -n "$web" ] || { echo "::error::build-push-action reported no digest"; exit 1; }
          touch "/tmp/digests/api/${api#sha256:}" "/tmp/digests/web/${web#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/desktop.yml
    with:
      signed: false
      source_ref: ${{ needs.verify.outputs.tag }}
    secrets: inherit

  publish:
    needs: [verify, build, desktop]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.releaseTag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - uses: actions/download-artifact@v4
        with:
          pattern: pdmux-*
          merge-multiple: true
          path: /tmp/desktop

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.verify.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Join the per-architecture digests into one tag
        run: |
          set -euo pipefail
          tag='${{ needs.verify.outputs.tag }}'
          join() {
            local repo="$1" dir="/tmp/digests/$2" refs=()
            for d in "$dir"/*; do refs+=("${repo}@sha256:$(basename "$d")"); done
            [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 digests for $repo, found ${#refs[@]}"; exit 1; }
            docker buildx imagetools create -t "${repo}:${tag}" "${refs[@]}"
            docker buildx imagetools inspect "${repo}:${tag}"
          }
          join '${{ needs.verify.outputs.api }}' api
          join '${{ needs.verify.outputs.web }}' web

      - name: Set up Go for the agent build
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Build the agent binaries
        id: agent
        run: |
          bun tools/build-agent-binaries.mjs
          version="$(sed -nE 's/^[[:space:]]*(var|const)[[:space:]]+AgentVersion[[:space:]]*=[[:space:]]*"([^"]*)".*/\2/p' agent/internal/cli/version.go)"
          [ -n "$version" ] || { echo "::error file=agent/internal/cli/version.go::Could not read AgentVersion."; exit 1; }
          dir="apps/web/static/agent/$version"
          [ -d "$dir" ] || { echo "::error::build-agent-binaries.mjs produced no $dir"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Agent $version" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$dir/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare desktop release assets
        run: |
          bun tools/merge-desktop-update-metadata.mjs \
            /tmp/desktop/latest-mac.yml \
            /tmp/desktop/latest-mac-macos-intel.yml \
            /tmp/desktop/latest-mac-macos-apple-silicon.yml
          rm /tmp/desktop/latest-mac-macos-intel.yml /tmp/desktop/latest-mac-macos-apple-silicon.yml
          (
            cd /tmp/desktop
            sha256sum -- * > DESKTOP-SHA256SUMS
          )
          cat /tmp/desktop/DESKTOP-SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      # A version must identify identical bytes whether the web image is amd64,
      # arm64, or the standalone GitHub release asset.
      - name: Check both architectures carry the same agent binaries
        run: |
          set -euo pipefail
          web='${{ needs.verify.outputs.web }}:${{ needs.verify.outputs.tag }}'
          version='${{ steps.agent.outputs.version }}'
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "$web"
            cid="$(docker create --platform "linux/$arch" "$web")"
            docker cp "$cid:/app/apps/web/build/client/agent/$version/SHA256SUMS" "/tmp/sums-$arch"
            docker rm -f "$cid" >/dev/null
          done
          if ! diff -u "/tmp/sums-amd64" "/tmp/sums-arm64"; then
            echo "::error::The two architectures' web images carry different agent $version binaries."
            exit 1
          fi
          if ! diff -u "/tmp/sums-amd64" "${{ steps.agent.outputs.dir }}/SHA256SUMS"; then
            echo "::error::The release assets differ from the agent $version binaries inside the images."
            exit 1
          fi
          echo "Agent $version is identical in both images and in the release assets." >> "$GITHUB_STEP_SUMMARY"

      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: |
            ${{ steps.agent.outputs.dir }}/pdmux-agent-*
            ${{ steps.agent.outputs.dir }}/SHA256SUMS
            ${{ steps.agent.outputs.dir }}/manifest.json
            /tmp/desktop/*

      - name: Report what to deploy
        run: |
          echo "Pushed ${{ needs.verify.outputs.api }}:${{ needs.verify.outputs.tag }} (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${{ needs.verify.outputs.web }}:${{ needs.verify.outputs.tag }} (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "Attached macOS Intel, macOS Apple Silicon, Windows x64, and Linux x64 desktop artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Roll out with `podo deploy plan --profile <name> --release ${{ needs.verify.outputs.tag }}`, then apply the printed hash.' >> "$GITHUB_STEP_SUMMARY"
