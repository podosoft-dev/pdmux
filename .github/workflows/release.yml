# Build and publish the release images for a tag.
#
# `podo deploy` consumes images; it does not build them. This is the other half:
# tagging a commit produces the two images that `podo deploy apply` then rolls out.
# It stops at the push, because rolling out requires confirming a plan hash and that
# approval belongs to a person.
#
# ── Which runner, and what it costs ──────────────────────────────────────────────
#
# GitHub-hosted runners are free for PUBLIC repositories only. In a PRIVATE
# repository every minute is metered against the account's included Actions minutes
# and billed beyond them -- and image builds are the most expensive job most
# projects run. A self-hosted runner consumes no Actions minutes at all, whatever
# the repository's visibility.
#
# So the runner is a variable rather than a constant:
#
#   PODOKIT_RUNNER   repository or organization variable, a JSON array of labels.
#                    Unset -> ["ubuntu-latest"], which is right for a public
#                    repository and costs money in a private one.
#                    Self-hosted example: ["self-hosted","Linux","X64"]
#
# Set it before the first tag if this repository is private. Nothing here warns you
# when you have not: the workflow succeeds either way, and the difference shows up
# on a bill.
#
# ── The other two variables ──────────────────────────────────────────────────────
#
#   PODOKIT_DEPLOY_PROFILE   which .podokit/deploy/<name>.json names the image
#                            repositories. Unset -> production.
#   PODOKIT_IMAGE_PLATFORM   the architecture the deployment target runs.
#                            Unset -> linux/amd64. Building for the wrong one
#                            produces "exec format error" at rollout, after the
#                            migration has already run.
#
# ── Secrets ──────────────────────────────────────────────────────────────────────
#
#   REGISTRY_USERNAME / REGISTRY_PASSWORD   credentials for the registry named by
#   the profile. A robot or deploy account is enough, but note that some registries
#   refuse to let a robot CREATE a repository -- push the first tag of a new
#   repository with an account that can, or create it in the registry first.

name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    # ⚠ BOTH OF THESE ARE LOAD-BEARING. Without `packages: write` the ghcr push is a
    # 403 that reads like a credential problem, and the credential is the token these
    # lines grant. Without `contents: write` attaching the agent binaries to the
    # release fails the same way, at the very end of a job that already pushed images.
    permissions:
      contents: write
      packages: write
    # One job builds both images rather than a matrix of two. A self-hosted pool is
    # usually small, and fanning out here takes runners away from every other
    # repository that shares it for no wall-clock gain on a multi-core machine.
    runs-on: ${{ fromJSON(vars.PODOKIT_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The workspace packages compile first. `npm ci` only links them; the apps and
      # `@pdmux/ui`'s svelte-check resolve them through their published entry points,
      # which do not exist until they are built. Without this the verification below
      # fails on "Cannot find module @pdmux/core" rather than on anything real.
      - name: build packages
        run: |
          npm run build -w @pdmux/protocol
          npm run build -w @pdmux/core
          npm run build -w @pdmux/ui
          npm run build -w @pdmux/mcp
          # And the SvelteKit app's generated tsconfig, which `svelte-check` reads
          # and only `svelte-kit sync` writes. CI hides this by building the apps
          # first; here lint runs before any app build.
          npm exec -w pdmux-web -- svelte-kit sync

      # Verify before publishing. An image built from a commit that never passed is
      # indistinguishable from one that did, once it is in the registry.
      - run: npm run lint
      - run: npm test

      - name: Read the release target from the deployment profile
        id: profile
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const name = process.env.PROFILE || "production";
            const path = `.podokit/deploy/${name}.json`;
            let profile;
            try {
              profile = JSON.parse(readFileSync(path, "utf8"));
            } catch {
              throw new Error(`No deployment profile at ${path}. Run podo deploy init first.`);
            }
            const { apiRepository, webRepository } = profile.release ?? {};
            if (!apiRepository || !webRepository) {
              throw new Error(`${path} does not declare release.apiRepository and release.webRepository.`);
            }
            // Everything before the first slash is a registry host only when it
            // looks like one; otherwise the reference is a Docker Hub short name.
            const first = apiRepository.split("/")[0];
            const registry = /[.:]/.test(first) ? first : "";
            const out = [
              `api=${apiRepository}`,
              `web=${webRepository}`,
              `registry=${registry}`,
              `tag=${process.env.GITHUB_REF_NAME}`,
            ].join("\n");
            process.stdout.write(out + "\n");
          ' >> "$GITHUB_OUTPUT"
        env:
          PROFILE: ${{ vars.PODOKIT_DEPLOY_PROFILE }}

      - uses: docker/setup-buildx-action@v3

      # ⚠ NO REGISTRY SECRET. The images go to this repository's own package
      # registry, so the token the workflow already has is the credential — two
      # long-lived secrets stopped existing when this changed, which is the whole
      # point of moving. `registry` still comes from the profile so a deployment that
      # publishes somewhere else only edits one JSON file.
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ vars.PODOKIT_IMAGE_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ${{ steps.profile.outputs.api }}:${{ steps.profile.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ vars.PODOKIT_IMAGE_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ${{ steps.profile.outputs.web }}:${{ steps.profile.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # ⚠ THE BINARIES ARE PUBLISHED IN ADDITION, NOT INSTEAD. An agent fetches its
      # update from the server it authenticated against and nowhere else: the contract
      # makes `artifactPath` a path rather than a URL, and the Go agent refuses a URL,
      # a bare path, a protocol-relative path and a redirect. Pointing agents at
      # github.com would mean taking that defence out, and one frame would then be able
      # to make a whole fleet fetch bytes from an arbitrary origin.
      #
      # So the server keeps serving `/agent/<v>/…` out of its own image, unchanged, and
      # these assets exist for the other reader — somebody who found the repository and
      # wants the binary and its checksums the ordinary way.
      #
      # Both copies are built from this commit, so their sha256 must match. If they ever
      # differ that is not noise, it is reproducibility breaking.
      - name: Set up Go for the agent build
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Build the agent binaries
        id: agent
        run: |
          node tools/build-agent-binaries.mjs
          # ⚠ READ THE VERSION, DO NOT GUESS IT FROM THE DIRECTORY. A checkout carries
          # the manifests of every past release, and picking the last entry by string
          # sort puts 0.1.9 above 0.1.10. `version.go` is what the builder itself used,
          # and this is the same sed ci.yml reads it with.
          # ⚠ `-E`, NOT THE BRE FORM ci.yml USES. `\|` alternation is a GNU extension, so
          # the BRE version silently returns an empty string on BSD sed — anyone
          # checking this step on a Mac would conclude the build produced nothing.
          # Extended syntax means the same thing to both.
          version="$(sed -nE 's/^[[:space:]]*(var|const)[[:space:]]+AgentVersion[[:space:]]*=[[:space:]]*"([^"]*)".*/\2/p' agent/internal/cli/version.go)"
          [ -n "$version" ] || { echo "::error file=agent/internal/cli/version.go::Could not read AgentVersion."; exit 1; }
          dir="apps/web/static/agent/$version"
          [ -d "$dir" ] || { echo "::error::build-agent-binaries.mjs produced no $dir"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Agent $version" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$dir/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.agent.outputs.dir }}/pdmux-agent-*
            ${{ steps.agent.outputs.dir }}/SHA256SUMS
            ${{ steps.agent.outputs.dir }}/manifest.json

      - name: Report what to deploy
        run: |
          echo "Pushed ${{ steps.profile.outputs.api }}:${{ steps.profile.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${{ steps.profile.outputs.web }}:${{ steps.profile.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Roll out with `podo deploy plan --profile <name> --release ${{ steps.profile.outputs.tag }}`, then apply the printed hash.' >> "$GITHUB_STEP_SUMMARY"
