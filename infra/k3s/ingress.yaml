# Example only. See README.md in this directory; `podo deploy` renders its own.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compression
  namespace: podokit
spec:
  compress: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: podokit
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: podokit-compression@kubernetescrd
spec:
  # Name the controller explicitly rather than relying on a default IngressClass.
  ingressClassName: traefik
  # app-config sets an https:// origin, so the route has to terminate TLS. Create the
  # Secret out of band (cert-manager, or an existing certificate) and name it here.
  tls:
    - hosts: [example.com]
      secretName: app-tls
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 3000 } }
