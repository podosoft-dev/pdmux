apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: podokit
data:
  NODE_ENV: "production"
  PORT: "3000"
  CORS_ORIGIN: "https://example.com"
  BACKEND_INTERNAL_URL: "http://api:3000"
  BODY_SIZE_LIMIT: "3M"
  # pdmux: file transfers have no /api proxy deadline (docs/FILE-TRANSFERS.md).
  CONNECTION_IDLE_TIMEOUT: "0"
  API_IDLE_TIMEOUT: "35"
  TRUSTED_PROXY_HOPS: "1"
  PROTOCOL_HEADER: "x-forwarded-proto"
  HOST_HEADER: "x-forwarded-host"
  ADDRESS_HEADER: "x-forwarded-for"
  XFF_DEPTH: "1"
  AUDIT_LOG_ENABLED: "true"
  # podokit:end:runtime-config
