# Example only. See README.md in this directory; `podo deploy` renders its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: podokit
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          # Placeholder. Use one immutable, stable SemVer tag for api and web.
          image: ghcr.io/example/podokit-web:v0.0.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: app-config }
          # Without these a rolling update sends traffic to a process that has not
          # bound its port yet. /healthz never calls the API, so an API outage does
          # not take the web pods out of service.
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 15
            timeoutSeconds: 2
